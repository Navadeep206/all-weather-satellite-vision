[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "all-weather-satellite-vision"
version = "0.1.0"
description = "All-Weather Satellite Vision: Multi-Stage Satellite Image Restoration and Multispectral-to-RGB Translation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
